table:
  name: business_hours
  schema: public
object_relationships:
  - name: salon
    using:
      foreign_key_constraint_on: salon_id
insert_permissions:
  - role: user
    permission:
      check:
        salon:
          memberships:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - active:
                  _eq: true
              - role:
                  _in:
                    - owner
                    - manager
      columns:
        - salon_id
        - weekday
        - opens_at
        - closes_at
select_permissions:
  - role: public
    permission:
      columns:
        - id
        - salon_id
        - weekday
        - opens_at
        - closes_at
      filter:
        salon:
          _and:
            - active:
                _eq: true
            - published:
                _eq: true
  - role: user
    permission:
      columns:
        - id
        - salon_id
        - weekday
        - opens_at
        - closes_at
      filter:
        salon:
          memberships:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - active:
                  _eq: true
