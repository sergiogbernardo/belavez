table:
  name: salon_memberships
  schema: public
object_relationships:
  - name: salon
    using:
      foreign_key_constraint_on: salon_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns:
        - salon_id
        - user_id
        - role
        - active
        - created_at
      filter:
        user_id:
          _eq: X-Hasura-User-Id
